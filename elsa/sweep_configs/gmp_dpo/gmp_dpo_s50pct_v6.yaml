program: main.py
method: grid
project: gmp_dpo_1.5b
name: gmp_dpo_s50pct_v6
entity: dyk6208-gwangju-institute-of-science-and-technology

# v6: correct beta/lambda scale for per-token average logprob DPO
#   v3 bug: beta=0.1 was correct for sequence-sum logprob but avg logprob
#           reduces margin scale by ~T (seq len) → DPO gradient ~5e4x too weak
#   fix: beta ∈ {3, 10} × lambda ∈ {0.1, 0.3}, lr fixed at 1e-4 (best from NTP baseline)
#   baseline comparison: gmp_dpo_ntp_baseline_v6 sweep (NTP-only, same lr)

command:
  - /home1/doyoonkim/miniconda3/envs/rac/bin/python
  - ${program}
  - ${args}

metric:
  name: math500_pass@1
  goal: maximize

parameters:
  seed:
    value: 42
  sparsity_ratio:
    value: 0.5
  model:
    value: "/home1/doyoonkim/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-R1-Distill-Qwen-1.5B/snapshots/ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562"
  dataset:
