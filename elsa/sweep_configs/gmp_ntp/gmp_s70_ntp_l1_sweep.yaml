program: main.py
method: grid
project: gmp_qwen3_1.5b_v2
name: gmp_s70_ntp_l1_sweep
entity: dyk6208-gwangju-institute-of-science-and-technology

# Plain L1 regularization on unstructured s70 GMP NTP
# Baseline comparison: 9ryq4acj (s70 NTP, best math500=0.410 at lr=1e-4)
# lr=1e-4 fixed (best from 9ryq4acj), sweep over l1_lambda
# l1_lambda=0.0 is NTP-only baseline (should reproduce ~0.410)

command:
  - /home1/doyoonkim/miniconda3/envs/rac/bin/python
  - ${program}
  - ${args}

metric:
  name: math500_pass@1
  goal: maximize

parameters:
  seed:
    value: 42
  sparsity_ratio:
    value: 0.7
  sparsity_type:
    value: "unstructured"
  gmp_lr:
    value: 1e-4
  gmp_l1_lambda:
    values: [0.0, 1e-4, 1e-3, 1e-2]
  gmp_kd_lambda:
    value: 0.0
  model:
    value: "/home1/doyoonkim/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-R1-Distill-Qwen-1.5B/snapshots/ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562"
  dataset:
    value: "math_cot"
  data_path:
    value: "/home1/doyoonkim/projects/elsa/data/math_220k_cot.jsonl"
  do_gmp:
    value: true
  gmp_steps:
    value: 1024
  gmp_batch_size:
    value: 1
  gmp_grad_accum:
    value: 8
  gmp_warmup_ratio:
    value: 0.05
  gmp_mask_interval:
    value: 32
  gmp_fisher_beta:
    value: 0.999
  gmp_max_seq_len:
    value: 2048
  gmp_max_prompt_len:
    value: 512
  gmp_save_path:
    value: "/home1/doyoonkim/projects/elsa/models"
  save_model:
    value: true
  eval_math500:
    value: true
  math500_max_new_tokens:
    value: 8192
  math500_max_samples:
    value: 500
  eval_zero_shot:
    value: false
  wandb:
    value: true
  wandb_project:
    value: "gmp_qwen3_1.5b_v2"
  push_to_hub:
    value: true
